name: Task
description: A unit of work traceable to a sprint, user story or requirement.
labels: ["type:feature"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this is needed (1-3 lines).
    validations:
      required: true
  - type: input
    id: traceability
    attributes:
      label: Traceability
      description: User story · requirement · instrument affected
      placeholder: "HU-01 · RF-01 · Quena / Zampoña / Tarka"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Architectural Area
      options: [backend, mobile, web, ml, infra, docs]
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: What to do
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable and verifiable. Include the automated test that covers it.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
