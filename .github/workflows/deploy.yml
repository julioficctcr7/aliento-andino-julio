name: Deploy to VPS

# Runs only after CI succeeds on a push to main (merged PR), or manually.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Service to deploy
        type: choice
        options: [all, backend, web, docs, ml]
        default: all

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }} # ej: us-central1-docker.pkg.dev/PROJECT_ID/aliento-andino
  VM_HOST: ${{ secrets.VM_HOST }} # IP o dominio de la VM
  VM_USER: ${{ secrets.VM_USER }} # Usuario SSH de la VM
  IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

jobs:
  # --- Detección de cambios desplegables ---
  changes:
    name: Detect deployable changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.filter.outputs.should_deploy }}
      deploy_backend: ${{ steps.filter.outputs.deploy_backend }}
      deploy_web: ${{ steps.filter.outputs.deploy_web }}
      deploy_infra: ${{ steps.filter.outputs.deploy_infra }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - id: filter
        name: Check deployable changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.target }}"
            echo "Manual deployment triggered for target: $TARGET"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "deploy_backend=$([ "$TARGET" = "all" ] || [ "$TARGET" = "backend" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            echo "deploy_web=$([ "$TARGET" = "all" ] || [ "$TARGET" = "web" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            echo "deploy_infra=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          echo "Files modified in commit:"
          echo "$files"

          has() {
            [ -n "$files" ] && echo "$files" | grep -Eq "$1"
          }

          deploy_backend=$(has "^(apps/backend|apps/ml)/" && echo true || echo false)
          deploy_web=$(has "^apps/web/" && echo true || echo false)
          deploy_infra=$(has "^(infra/|docker-compose|\.github/workflows/deploy\.yml)" && echo true || echo false)

          if [ "$deploy_backend" = "true" ] || [ "$deploy_web" = "true" ] || [ "$deploy_infra" = "true" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Deployable changes detected. Proceeding with deployment."
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "No deployable service or infra files modified. Skipping VPS deployment."
          fi

          echo "deploy_backend=$deploy_backend" >> "$GITHUB_OUTPUT"
          echo "deploy_web=$deploy_web" >> "$GITHUB_OUTPUT"
          echo "deploy_infra=$deploy_infra" >> "$GITHUB_OUTPUT"

  # --- Build y push imágenes ---
  build:
    name: Build & Push Docker Images
    needs: changes
    if: needs.changes.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker $(echo $DOCKER_REGISTRY | cut -d'/' -f1) --quiet

      - name: Build & push backend image
        if: needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_infra == 'true'
        run: |
          docker build -t $DOCKER_REGISTRY/aliento-andino-backend:$IMAGE_TAG \
                        -t $DOCKER_REGISTRY/aliento-andino-backend:latest \
                        ./apps/backend
          docker push $DOCKER_REGISTRY/aliento-andino-backend:$IMAGE_TAG
          docker push $DOCKER_REGISTRY/aliento-andino-backend:latest

      - name: Build & push web image
        if: needs.changes.outputs.deploy_web == 'true' || needs.changes.outputs.deploy_infra == 'true'
        run: |
          docker build -t $DOCKER_REGISTRY/aliento-andino-web:$IMAGE_TAG \
                        -t $DOCKER_REGISTRY/aliento-andino-web:latest \
                        ./apps/web
          docker push $DOCKER_REGISTRY/aliento-andino-web:$IMAGE_TAG
          docker push $DOCKER_REGISTRY/aliento-andino-web:latest

  # --- Deploy a la VM ---
  deploy:
    name: Deploy to VM
    needs: [changes, build]
    if: needs.changes.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $VM_HOST >> ~/.ssh/known_hosts

      - name: Copy deployment files to VM
        run: |
          scp -i ~/.ssh/deploy_key \
            infra/docker-compose.yml \
            $VM_USER@$VM_HOST:~/aliento-andino/

          scp -i ~/.ssh/deploy_key -r \
            infra/nginx/ \
            $VM_USER@$VM_HOST:~/aliento-andino/

      - name: Deploy on VM
        run: |
          ssh -i ~/.ssh/deploy_key $VM_USER@$VM_HOST << 'EOF'
            set -e
            cd ~/aliento-andino

            # Autenticar Docker con Artifact Registry
            gcloud auth configure-docker $(echo ${{ env.DOCKER_REGISTRY }} | cut -d'/' -f1) --quiet

            # Setear tag de imagen y registry para docker-compose.yml interpolation
            export IMAGE_TAG=${{ env.IMAGE_TAG }}
            export DOCKER_REGISTRY=${{ env.DOCKER_REGISTRY }}

            DEPLOY_BACKEND="${{ needs.changes.outputs.deploy_backend }}"
            DEPLOY_WEB="${{ needs.changes.outputs.deploy_web }}"
            DEPLOY_INFRA="${{ needs.changes.outputs.deploy_infra }}"

            # Pull nuevas imágenes y recrear contenedores según lo que cambió
            if [ "$DEPLOY_BACKEND" = "true" ] && [ "$DEPLOY_WEB" = "true" ]; then
              docker compose --env-file .env.production pull backend web
              docker compose --env-file .env.production up -d --no-deps backend web
            elif [ "$DEPLOY_BACKEND" = "true" ]; then
              docker compose --env-file .env.production pull backend
              docker compose --env-file .env.production up -d --no-deps backend
            elif [ "$DEPLOY_WEB" = "true" ]; then
              docker compose --env-file .env.production pull web
              docker compose --env-file .env.production up -d --no-deps web
            elif [ "$DEPLOY_INFRA" = "true" ]; then
              docker compose --env-file .env.production up -d
            fi

            # Reiniciar nginx para re-resolver DNS de los nuevos containers
            docker compose --env-file .env.production restart nginx

            # Si cambió el backend o la infraestructura, actualizar migraciones y seeds
            if [ "$DEPLOY_BACKEND" = "true" ] || [ "$DEPLOY_INFRA" = "true" ]; then
              docker compose --env-file .env.production exec -T backend alembic upgrade head < /dev/null
              docker compose --env-file .env.production exec -T backend python seed_all.py < /dev/null
            fi

            # Limpiar imágenes viejas
            docker image prune -f

            echo "Deploy completado: $IMAGE_TAG"
          EOF

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key $VM_USER@$VM_HOST << 'EOF'
            set -e
            cd ~/aliento-andino
            echo "=== Contenedores activos ==="
            docker compose --env-file .env.production ps
            echo ""
            echo "=== Health check backend ==="
            backend_ready=false
            for attempt in {1..12}; do
              if curl -sf --connect-timeout 2 --max-time 5 http://localhost:8000/health > /dev/null; then
                backend_ready=true
                break
              fi
              echo "Esperando backend... ($attempt/12)"
              sleep 5
            done

            if [ "$backend_ready" != "true" ]; then
              echo "Backend FAIL"
              docker compose --env-file .env.production logs --tail=100 backend
              exit 1
            fi

            echo "Backend OK"
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
