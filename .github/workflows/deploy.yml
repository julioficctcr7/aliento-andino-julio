name: Deploy to VPS

# Despliega automáticamente a la VM en cada push a main o de forma manual.
on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'apps/web/**'
      - 'apps/docs/**'
      - 'apps/ml/**'
      - 'infra/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Servicio a desplegar
        type: choice
        options: [all, backend, web, docs, ml]
        default: all

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VM_HOST: ${{ secrets.VM_HOST }}
  VM_USER: ${{ secrets.VM_USER }}

jobs:
  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on VM
        env:
          TARGET: ${{ github.event.inputs.target || 'all' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$VM_USER@$VM_HOST" "TARGET=$TARGET bash -s" << 'EOF'
            set -euo pipefail
            cd ~/aliento-andino

            echo "=== Actualizando repositorio ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Reconstruyendo y levantando servicios ($TARGET) ==="
            if [ "$TARGET" = "all" ]; then
              docker compose -f infra/docker-compose.yml --env-file .env.production up -d --build
            else
              docker compose -f infra/docker-compose.yml --env-file .env.production up -d --build --no-deps "$TARGET"
              docker compose -f infra/docker-compose.yml --env-file .env.production restart nginx
            fi

            if [ "$TARGET" = "all" ] || [ "$TARGET" = "backend" ]; then
              echo "=== Ejecutando migraciones y seeds ==="
              docker compose -f infra/docker-compose.yml --env-file .env.production exec -T backend alembic upgrade head
              docker compose -f infra/docker-compose.yml --env-file .env.production exec -T backend python seed_all.py
            fi

            docker image prune -f
            echo "=== Contenedores activos ==="
            docker compose -f infra/docker-compose.yml --env-file .env.production ps

            echo "=== Health check backend ==="
            for attempt in $(seq 1 12); do
              if curl -sf --connect-timeout 2 --max-time 5 http://127.0.0.1/health > /dev/null; then
                echo "Backend y Nginx OK"
                exit 0
              fi
              echo "Esperando backend... ($attempt/12)"
              sleep 5
            done

            echo "Backend FAIL"
            docker compose -f infra/docker-compose.yml --env-file .env.production logs --tail=80 backend nginx
            exit 1
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
